name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # v5: runs on Node 24 runtime (v4 used Node 20, which GitHub deprecated)
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Regenerate lockfile on Linux to resolve platform-specific native deps
      # (tailwindcss/oxide, etc.) that Windows-generated lockfile cannot include.
      # Version ranges in package.json are tight enough to prevent drift.
      - run: rm -f package-lock.json

      - run: npm install

      # Schema migrations are belt-and-suspenders — the Worker/Function also
      # self-heals missing tables/columns at cold start (initSchema in src/db.ts),
      # so this step only needs to succeed once per new migration file.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ vars.D1_DATABASE_NAME || 'vega-api-db' }} --remote

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}